<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Твой след</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/images/logo1.png" alt="Твой след">
            </div>
            <h1 class="auth-title">Регистрация</h1>
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group half">
                        <label>Имя *</label>
                        <input type="text" id="firstname" name="firstname" required placeholder="Иван">
                    </div>
                    <div class="form-group half">
                        <label>Фамилия *</label>
                        <input type="text" id="lastname" name="lastname" required placeholder="Иванов">
                    </div>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label for="password">Пароль * (минимум 6 символов)</label>
                    <input type="password" id="password" name="password" required placeholder="••••••">
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="attachCardCheckbox"> Привязать банковскую карту
                    </label>
                </div>
                
                <div id="cardFields" style="display: none;">
                    <div class="form-group">
                        <label for="card_number">Номер карты</label>
                        <input type="text" id="card_number" placeholder="1234 5678 9012 3456" maxlength="19">
                    </div>
                    <div class="form-row">
                        <div class="form-group half">
                            <label for="card_expiry">Срок (ММ/ГГ)</label>
                            <input type="text" id="card_expiry" placeholder="12/28" maxlength="5">
                        </div>
                        <div class="form-group half">
                            <label for="card_cvv">CVV</label>
                            <input type="password" id="card_cvv" placeholder="123" maxlength="3">
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="agreeCheckbox" required> Я соглашаюсь на обработку персональных данных *
                    </label>
                </div>
                
                <div class="form-error" id="registerError" style="display: none;"></div>
                <button type="submit" class="auth-btn">Зарегистрироваться</button>
            </form>
            <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
        </div>
    </div>
    <script src="/script.js"></script>
    <script src="/auth.js"></script>
</body>
</html>
