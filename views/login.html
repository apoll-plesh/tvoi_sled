<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Твой след</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/images/logo1.png" alt="Твой след">
            </div>
            <h1 class="auth-title">Вход</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" name="password" required placeholder="••••••">
                </div>
                <div class="form-row">
                    <a href="#" id="forgotPasswordLink" class="forgot-link">Забыли пароль?</a>
                </div>
                <div class="form-error" id="loginError" style="display: none;"></div>
                <button type="submit" class="auth-btn">Войти</button>
            </form>
            <p class="auth-link">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
        </div>
    </div>
    
    <!-- Модальное окно для восстановления пароля -->
    <div class="modal" id="forgotModal">
        <div class="modal__content">
            <button class="modal__close" id="closeForgotModalBtn">&times;</button>
            <h3>Восстановление пароля</h3>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="resetEmail">Ваш email</label>
                    <input type="email" id="resetEmail" required placeholder="example@mail.ru">
                </div>
                <div class="form-error" id="forgotError" style="display: none;"></div>
                <div class="form-success" id="forgotSuccess" style="display: none;"></div>
                <button type="submit" class="auth-btn" style="margin-top: 20px;">Отправить</button>
            </form>
        </div>
    </div>

    <script src="/script.js"></script>
    <script src="/auth.js"></script>
</body>
</html>
